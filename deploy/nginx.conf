# nginx для grin.nemilya.me — только если папку ещё никто не раздаёт (deploy/README.md). Один раз на сервере:
#   sudo cp nginx.conf /etc/nginx/sites-available/grin
#   sudo ln -s /etc/nginx/sites-available/grin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d grin.nemilya.me        # https; часть для 443 certbot допишет сам
# /var/www/grin — та же папка, что в DEPLOY (local.mk).
server {
    listen 80;
    listen [::]:80;
    server_name grin.nemilya.me;
    root /var/www/grin;                     # = папка из DEPLOY: содержимое dist/

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;   # webp, m4a, mp3, woff2 уже сжаты

    # Стили, скрипты, шрифты, сцена: ссылки со штампом ?v=<хеш> или в папке stage-<хеш>/ — смысл не меняется.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        if ($arg_v) {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    location ~ ^/assets/stage-[0-9a-f]+/ {
        types { application/javascript js; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Медиа видео (слои webp, таймлайны, звук m4a, постеры) и озвучка (mp3 + разметка): ссылки с ?v=<отпечаток>.
    # Перемотку (Range) nginx отдаёт сам.
    location ~ "^/(media/|[a-z]{2}/.+/audio/)" {
        types { audio/mpeg mp3; audio/mp4 m4a; application/json json; image/webp webp; }
        add_header Cache-Control "public, max-age=3600";
        if ($arg_v) {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    # Страницы: коротко — новая сборка видна через минуту и не смешивается со старым кешем.
    location / {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=60";
    }
}
