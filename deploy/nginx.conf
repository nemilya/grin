# nginx for grin.nemilya.me — only if nothing serves the folder yet (deploy/README.md, in Russian — deploy/README.ru.md). Once, on the server:
#   sudo cp nginx.conf /etc/nginx/sites-available/grin
#   sudo ln -s /etc/nginx/sites-available/grin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d grin.nemilya.me        # https; certbot adds the 443 part itself
# /var/www/grin — the same folder as in DEPLOY (local.mk).
server {
    listen 80;
    listen [::]:80;
    server_name grin.nemilya.me;
    root /var/www/grin;                     # = the folder from DEPLOY: the contents of dist/

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;   # webp, m4a, mp3, woff2 are already compressed

    # Styles, scripts, fonts, the stage: links stamped ?v=<hash> or in a stage-<hash>/ folder — the content never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        if ($arg_v) {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    location ~ ^/assets/stage-[0-9a-f]+/ {
        types { application/javascript js; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Video media (webp layers, timelines, m4a sound, posters) and narration (mp3 + marks): links with ?v=<fingerprint>.
    # nginx serves seeking (Range) itself.
    location ~ "^/(media/|[a-z]{2}/.+/audio/)" {
        types { audio/mpeg mp3; audio/mp4 m4a; application/json json; image/webp webp; }
        add_header Cache-Control "public, max-age=3600";
        if ($arg_v) {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    # Pages: briefly — a new build is visible within a minute and doesn't mix with the old cache.
    location / {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=60";
    }
}
